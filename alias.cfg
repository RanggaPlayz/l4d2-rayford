alias "sv>alias"          "exec alias.cfg; say Alias Command Refreshed."

// Mini Scripts here
alias "sb>kick"           "exec custom/scripts/sourcemod-bot_kick.cfg"      // Kick All Survivor Bots
alias "sb>kill"           "exec custom/scripts/sourcemod-bot_kill.cfg"      // Kill All Survivor Bots
alias "sb>stop"           "sm_cvar sb_stop 1"
alias "sb>move"           "sm_cvar sb_stop 0"
alias "sb>add"            "exec custom/scripts/console-bot_add_l4d2.cfg"
alias "sb>add_l4d1"       "exec custom/scripts/console-bot_add_l4d1.cfg"
alias "sb>add_all"        "sb>add; sb>add_l4d1"

alias "nb>kick"           "exec custom/scripts/sourcemod-si_kick.cfg"

alias "sv>dev"            "exec init.dev"                                   // Enable Developer Environment
alias "sv>deround"        "exec fix/roundleftover.cfg"                      // Disable unexpected Cheat Convar caused by Readyup for example
alias "sv>nodir"          "exec custom/scripts/console-quiet_down"          // Disable Director
alias "sv>rm"             "exec noconf.cfg; say The Matchmode was forcefully unloaded"
alias "sv>reset"          "sm_cvar mp_restartgame 1; say The game is restarting..."

// Map here
alias tummie              "sm_map tumtara"
alias empty               "sm_map tumtara_empty"
