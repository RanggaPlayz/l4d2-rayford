alias "exe>alias"          "exec alias.cfg; say Alias Command Refreshed."

// Mini Scripts here
alias "sb>kick"           "exec custom/scripts/sourcemod-bot_kick.cfg"      // Kick All Survivor Bots
alias "sb>kill"           "exec custom/scripts/sourcemod-bot_kill.cfg"      // Kill All Survivor Bots
alias "sb>stop"           "sm_cvar sb_stop 1"
alias "sb>move"           "sm_cvar sb_stop 0"
alias "sb>add"            "exec custom/scripts/console-bot_add_l4d2.cfg"
alias "sb>add_l4d1"       "exec custom/scripts/console-bot_add_l4d1.cfg"
alias "sb>add_all"        "sb>add; sb>add_l4d1"

alias "nb>kick"           "exec custom/scripts/sourcemod-si_kick.cfg"

alias "sv>dev"            "exec init.cfg"                                   // Enable Developer Environment
alias "sv>deround"        "exec fix/roundleftover.cfg"                      // Disable unexpected Cheat Convar caused by Readyup Plugins and others.
alias "sv>nodir"          "exec custom/scripts/console-quiet_down"          // Disable Director
alias "sv>rm"             "exec noconf.cfg; say The Matchmode was forcefully unloaded"
alias "sv>reset"          "sm_cvar mp_restartgame 1; say The game is restarting..."
alias "ogl>dev"           "sm_fm devtest"
alias "ogl>redev"         "sm_fchmatch devtest"

// Map here
alias tummie              "sm_map tumtara"
alias empty               "sm_map tumtara_empty"

// Reset Match (or) Unload Confogl here!
alias "rma>all" "rma>clean; rma>ready; rma>static; rma>string; rma>clivars; rma>rcvars; rma>plugin; rma>pmload; rma>alias" 
alias "rma>clean" "exec fix/roundleftover.cfg"
alias "rma>ready" "l4d_ready_enabled 0"
alias "rma>static" "reset_static_maps"
alias "rma>string" "sm_resetstringcount"
alias "rma>clivars" "confogl_resetclientcvars"
alias "rma>rcvars" "confogl_resetcvars"
alias "rma>plugin" "pred_unload_plugins"
alias "rma>pmload" "pm_unload_plugins refresh"
alias "rma>alias" "unalias whatmatch"