// Define Gamemode
confogl_addcvar mp_gamemode "coop"
confogl_addcvar sv_gametypes "coop"
alias whatmatch "say Current Match Loaded: Default Co-op"

// Shared Cvars
exec cfgogl/default_coop/shared_cvars.cfg
exec cfgogl/default_coop/shared_settings.cfg

// Execute own.
exec cfgogl/default_coop/default_coop.cfg

// Enforce, Apply Convars
confogl_setcvars