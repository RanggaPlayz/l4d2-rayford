// Define Gamemode
confogl_addcvar mp_gamemode "versus"
confogl_addcvar sv_gametypes "versus"
confogl_addcvar z_difficulty "Normal"
alias whatmatch "say Current Match Loaded: Remastered Versus - Tier 1 [made by Artyx]"
confogl_addcvar hostname_current_mode "T1 Versus"

exec cfgogl/remastered_versus/shared_cvars.cfg
exec cfgogl/remastered_versus/shared_settings.cfg

// [l4d2_weaponrules.smx]
l4d2_addweaponrule rifle                  smg
l4d2_addweaponrule rifle_desert           smg_silenced
l4d2_addweaponrule rifle_ak47             smg_silenced
l4d2_addweaponrule rifle_sg552            mp5

l4d2_addweaponrule autoshotgun            pumpshotgun
l4d2_addweaponrule shotgun_spas           shotgun_chrome

l4d2_addweaponrule hunting_rifle          pumpshotgun
l4d2_addweaponrule sniper_military        shotgun_chrome
l4d2_addweaponrule sniper_scout           pumpshotgun
l4d2_addweaponrule sniper_awp             shotgun_chrome

l4d2_addweaponrule rifle_m60              mp5
l4d2_addweaponrule grenade_launcher       shotgun_chrome