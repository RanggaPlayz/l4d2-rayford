// Define Gamemode
confogl_addcvar mp_gamemode "versus"
confogl_addcvar sv_gametypes "versus"
alias whatmatch "say Current Match Loaded: Taaannnk!! [Mutation]"
confogl_addcvar hostname_current_mode "Taaannnk!!"

confogl_addcvar vs_max_team_switches 999

// Simulate Default Tickrate
exec ratetype/persistent/flexible.cfg

// Execute Other files
exec cfgogl/mutation_tank-versus/confogl_cvars.cfg
exec cfgogl/mutation_tank-versus/mutation.cfg

confogl_setcvars