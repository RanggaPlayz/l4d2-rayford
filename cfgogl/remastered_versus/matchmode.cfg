// Define Gamemode
confogl_addcvar mp_gamemode "versus"
confogl_addcvar sv_gametypes "versus"
confogl_addcvar z_difficulty "Normal"
alias whatmatch "say Current Match Loaded: Remastered Versus [made by Artyx]"
confogl_addcvar hostname_current_mode "Re-Versus"

exec cfgogl/remastered_versus/shared_cvars.cfg
exec cfgogl/remastered_versus/shared_settings.cfg

// Custom ConVars here
confogl_addcvar confogl_replace_tier2 0
confogl_addcvar confogl_replace_tier2_finale 0
confogl_addcvar confogl_replace_tier2_all 0
confogl_addcvar confogl_remove_lasersight 0
confogl_addcvar confogl_replace_cssweapons 0