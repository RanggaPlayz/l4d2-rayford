// Execute own.
exec cfgogl/remastered_versus/remastered_versus.cfg

l4d_ready_cfg_name "Remastered Vanilla Versus"
hostname "The Crack Addicts [Versus]"

// ReadyUp Cvars
confogl_addcvar l4d_ready_enabled 1
confogl_addcvar l4d_skip_intro_allow 1
confogl_addcvar l4d_ready_unbalanced_min 1
confogl_addcvar l4d_ready_unbalanced_start 1

confogl_addcvar l4d_ready_survivor_freeze 0
confogl_addcvar l4d_ready_delay 2
confogl_addcvar l4d_ready_enable_sound 1
confogl_addcvar l4d_ready_chuckle 0
confogl_addcvar l4d_ready_live_sound "ui/bigreward.wav"
confogl_addcvar coinflip_delay -1
confogl_addcvar teamflip_delay -1

confogl_addcvar sv_voiceenable 1
confogl_addcvar sv_log_onefile 0
confogl_addcvar sv_logbans 1
confogl_addcvar vs_max_team_switches 9999
confogl_addcvar versus_marker_num 0

// Config Cvars
confogl_match_execcfg_off "confogl_off.cfg"
confogl_match_execcfg_on "confogl.cfg"

// Simulate ideal Tickrate
exec ratetype/persistent/flexible.cfg
// Shared Files
exec cfgogl/remastered_versus/custom-better_bots.cfg

// Enforce, Apply Convars
confogl_setcvars