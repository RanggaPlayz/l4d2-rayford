// Define Gamemode
confogl_addcvar mp_gamemode "versus"
confogl_addcvar sv_gametypes "versus"
confogl_addcvar z_difficulty "Normal"
alias whatmatch "say Current Match Loaded: Remastered Versus [made by Artyx]"

// Internal ConVars
confogl_addcvar adrenaline_duration 18
confogl_addcvar adrenaline_health_buffer 30
