// Simulate ideal Tickrate
exec ratetype/persistent/flexible.cfg

// Stripper Objects
confogl_addcvar stripper_cfg_path cfg/stripper/remastered_versus

// ReadyUp Cvars
confogl_addcvar l4d_ready_enabled 3
confogl_addcvar l4d_skip_intro_allow 1
confogl_addcvar l4d_ready_unbalanced_min 1
confogl_addcvar l4d_ready_unbalanced_start 1

confogl_addcvar l4d_ready_survivor_freeze 0
confogl_addcvar l4d_ready_delay 2
confogl_addcvar l4d_ready_enable_sound 1
confogl_addcvar l4d_ready_chuckle 0
confogl_addcvar l4d_ready_live_sound "ui/bigreward.wav"
confogl_addcvar coinflip_delay -1
confogl_addcvar teamflip_delay -1

confogl_addcvar sv_voiceenable 1
confogl_addcvar sv_log_onefile 0
confogl_addcvar sv_logbans 1
confogl_addcvar vs_max_team_switches 9999
confogl_addcvar versus_marker_num 0

// Confogl Config Files
confogl_match_execcfg_off "confogl_off.cfg"
confogl_match_execcfg_on "confogl.cfg"

// Health-related ConVars
confogl_addcvar adrenaline_duration 18
confogl_addcvar adrenaline_health_buffer 30
confogl_addcvar adrenaline_run_speed 245

// Survivor Bots and NextBots related ConVars
exec cfgogl/remastered_versus/shared_nextbot.cfg
confogl_addcvar director_allow_infected_bots 1
confogl_addcvar sb_all_bot_game 1
confogl_addcvar survivor_friendly_fire_factor_normal 0

// Other ConVars
confogl_addcvar worldmodel_turnrate 2160
confogl_addcvar mp_facefronttime -1
confogl_addcvar z_tank_autoshotgun_dmg_scale 1.0
confogl_addcvar ammo_shotgun_max 92

// Un-confogl's default config
confogl_addcvar sv_allow_wait_command 1
confogl_addcvar confogl_match_killlobbyres 0
confogl_addcvar confogl_SM_enable 0
confogl_addcvar confogl_boss_tank 0
confogl_addcvar confogl_boss_unprohibit 0
confogl_addcvar confogl_lock_boss_spawns 0
confogl_addcvar confogl_remove_escape_tank 0
confogl_addcvar confogl_disable_tank_hordes 1
confogl_addcvar confogl_block_punch_rock 0
confogl_addcvar confogl_blockinfectedbots 0
confogl_addcvar confogl_reduce_finalespawnrange 0

//confogl_addcvar confogl_replace_tier2 0
//confogl_addcvar confogl_replace_tier2_finale 0
//confogl_addcvar confogl_replace_tier2_all 0

confogl_addcvar confogl_limit_tier2 0
confogl_addcvar confogl_limit_tier2_saferoom 0

confogl_addcvar confogl_remove_chainsaw 1
confogl_addcvar confogl_remove_statickits 0
confogl_addcvar confogl_remove_defib 0
confogl_addcvar confogl_remove_grenade 0
confogl_addcvar confogl_remove_m60 1
//confogl_addcvar confogl_remove_lasersight 0
confogl_addcvar confogl_remove_saferoomitems 0
confogl_addcvar confogl_remove_upg_explosive 1
confogl_addcvar confogl_remove_upg_incendiary 0

confogl_addcvar confogl_adrenaline_limit 1
confogl_addcvar confogl_pills_limit 4
confogl_addcvar confogl_pipebomb_limit 2
confogl_addcvar confogl_molotov_limit 3
confogl_addcvar confogl_vomitjar_limit 1
confogl_addcvar confogl_confogl_SM_enable 0

//confogl_addcvar confogl_replace_cssweapons 0
confogl_addcvar confogl_replace_startkits 0
confogl_addcvar confogl_replace_finalekits 0

confogl_addcvar confogl_waterslowdown 0
confogl_addcvar confogl_enable_itemtracking 0
confogl_addcvar confogl_itemtracking_savespawns 0
confogl_addcvar confogl_itemtracking_mapspecific 0