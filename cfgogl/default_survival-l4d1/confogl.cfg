// Define Gamemode
confogl_addcvar mp_gamemode "survival"
confogl_addcvar sv_gametypes "survival"
alias whatmatch "say Current Match Loaded: Left 4 Dead 1 Survival Clone"

// Shared Cvars
exec cfgogl/default_coop-l4d1/shared_cvars.cfg
exec cfgogl/default_coop-l4d1/shared_settings.cfg

// Execute own.
exec cfgogl/default_survival-l4d1/default_survival.cfg

// Enforce, Apply Convars