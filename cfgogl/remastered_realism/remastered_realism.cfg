// Define Gamemode
confogl_addcvar mp_gamemode "realism"
confogl_addcvar sv_gametypes "realism"
alias whatmatch "say Current Match Loaded: Remastered Altered Realism [made by Artyx]"

// Internal ConVars
confogl_addcvar adrenaline_duration 30
confogl_addcvar adrenaline_health_buffer 25
confogl_addcvar adrenaline_run_speed 250

// Basic ConVars
confogl_addcvar director_allow_infected_bots 1
confogl_addcvar worldmodel_turnrate 140
confogl_addcvar mp_facefronttime -1
confogl_addcvar survivor_friendly_fire_factor_easy 0.1
confogl_addcvar survivor_friendly_fire_factor_normal 0.5
confogl_addcvar survivor_friendly_fire_factor_hard 1
confogl_addcvar survivor_friendly_fire_factor_expert 2.8

// Un-confogl's default config
confogl_addcvar sv_allow_wait_command 1
confogl_addcvar confogl_match_killlobbyres 0
confogl_addcvar confogl_SM_enable 0
confogl_addcvar confogl_boss_tank 0
confogl_addcvar confogl_boss_unprohibit 0
confogl_addcvar confogl_lock_boss_spawns 0
confogl_addcvar confogl_remove_escape_tank 0
confogl_addcvar confogl_disable_tank_hordes 0
confogl_addcvar confogl_block_punch_rock 0
confogl_addcvar confogl_blockinfectedbots 0
confogl_addcvar confogl_reduce_finalespawnrange 0

confogl_addcvar confogl_replace_tier2 0
confogl_addcvar confogl_replace_tier2_finale 0
confogl_addcvar confogl_replace_tier2_all 0

confogl_addcvar confogl_limit_tier2 0
confogl_addcvar confogl_limit_tier2_saferoom 0

confogl_addcvar confogl_remove_chainsaw 0
confogl_addcvar confogl_remove_statickits 0
confogl_addcvar confogl_remove_defib 0
confogl_addcvar confogl_remove_grenade 0
confogl_addcvar confogl_remove_m60 0
confogl_addcvar confogl_remove_lasersight 0
confogl_addcvar confogl_remove_saferoomitems 0
confogl_addcvar confogl_remove_upg_explosive 0
confogl_addcvar confogl_remove_upg_incendiary 0

confogl_addcvar confogl_adrenaline_limit 0
confogl_addcvar confogl_pills_limit 0
confogl_addcvar confogl_pipebomb_limit 0
confogl_addcvar confogl_molotov_limit 0
