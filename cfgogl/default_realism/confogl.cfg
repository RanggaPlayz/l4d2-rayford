// Define Gamemode
confogl_addcvar mp_gamemode "realism"
confogl_addcvar sv_gametypes "realism"
alias whatmatch "say Current Match Loaded: Default Realism"

// Shared Cvars
exec cfgogl/default_coop/shared_cvars.cfg
exec cfgogl/default_coop/shared_settings.cfg

// Execute own.
exec cfgogl/default_realism/default_realism.cfg

// Enforce, Apply Convars
confogl_setcvars